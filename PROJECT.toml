# Repository-specific context for AGENTS.md.
# Place this file in krkn-operator-ecosystem/krkn-operator-console/.
# All relative paths are resolved from that repository's root.

[project]
name = "krkn-operator-console"
type = "react-frontend"
description = "Krkn operator web UI; consumes the krkn-operator REST API to manage and present chaos engineering workflows."

[ecosystem_projects]
krkn-operator = "../krkn-operator"
krkn-operator-console = "."
krkn-operator-acm = "../krkn-operator-acm"
krknctl = "../../krknctl"
krkn = "../../krkn"

# Frontend locations described in the supplied project instructions.
# Inspect the actual checkout if a directory has moved or is absent.
[paths]
components = "src/components/"
pages = "src/pages/"
hooks = "src/hooks/"
utilities = "src/utils/"
api_client = "src/api/"

[beads]
project_label = "project:krkn-operator-console"
# Use the repository's existing .beads symlink to the shared central database.
# Do not initialize a new database or replace the symlink.
central_database = ".beads"
export_path = "beads/"
# Preserve the shared issue prefix already configured in Beads (tsebastiani).
# Follow the repository's actual Git policy for exports; do not change it here.

[commands]
# Intentionally unset for now, not a blocker by itself.
